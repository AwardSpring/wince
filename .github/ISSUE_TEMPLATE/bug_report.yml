name: Bug report
description: Flinch did something wrong, or stayed quiet when it should have spoken.
labels: [bug]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - False alarm (Flinch flagged something fine)
        - Missed catch (Flinch stayed quiet)
        - Slowed down or blocked my agent
        - Install or setup problem
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: "`flinch log` output"
      description: It holds no code or file paths, but check before pasting.
      render: text
  - type: input
    id: versions
    attributes:
      label: Flinch, Claude Code, and OS versions
